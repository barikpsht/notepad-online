<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Share-Notes</title>
<style>
  * { box-sizing: border-box; font-family: Arial, sans-serif; }

  body {
    margin: 0;
    background: #f3f3f3;
    color: #111;
  }

  header {
    background: #000;
    color: white;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  header .logo {
    background: white;
    color: black;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    font-size: 20px;
    font-weight: bold;
  }

  header h1 {
    margin: 0;
    font-size: 32px;
    font-weight: 900;
    letter-spacing: 1px;
  }

  .tabs {
    display: flex;
    justify-content: center;
    gap: 30px;
    border-bottom: 1px solid #ddd;
    background: #f3f3f3;
    padding: 14px 10px 0;
    flex-wrap: wrap;
  }

  .tab {
    background: none;
    border: none;
    padding: 10px 4px;
    font-size: 14px;
    font-weight: bold;
    color: #777;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    letter-spacing: 1px;
  }

  .tab.active {
    color: #111;
    border-color: #111;
  }

  .container {
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 20px;
  }

  .editor {
    width: 100%;
    min-height: 230px;
    padding: 18px;
    font-size: 16px;
    background: #f3f3f3;
    border: 1px solid #bbb;
    border-radius: 4px;
    resize: vertical;
    outline: none;
  }

  .share-area {
    text-align: center;
    margin-top: 30px;
  }

  .share-btn {
    background: #000;
    color: white;
    padding: 12px 28px;
    border: none;
    border-radius: 30px;
    font-size: 15px;
    cursor: pointer;
  }

  .share-btn:hover { background: #222; }

  .status {
    color: #c1224f;
    margin-top: 14px;
    font-size: 14px;
    min-height: 20px;
  }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 999;
  }

  .modal {
    background: white;
    width: 100%;
    max-width: 430px;
    border-radius: 6px;
    padding: 26px 30px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.25);
  }

  .modal h2 {
    margin: 0 0 10px;
    font-size: 22px;
  }

  .modal p {
    margin: 0 0 6px;
    color: #444;
  }

  .shared-url {
    color: #1a73e8;
    word-break: break-all;
    margin-bottom: 22px;
    font-size: 15px;
  }

  .modal-buttons {
    display: flex;
    gap: 14px;
  }

  .modal-buttons button {
    flex: 1;
    padding: 11px 0;
    font-weight: bold;
    border: none;
    border-radius: 4px;
    color: white;
    cursor: pointer;
    letter-spacing: 1px;
  }

  .copy-btn  { background: #a323c5; }
  .open-btn  { background: #2e7d32; }
  .close-x {
    background: none;
    border: none;
    float: right;
    font-size: 20px;
    cursor: pointer;
    color: #555;
  }

  @media (max-width: 500px) {
    header h1 { font-size: 22px; }
    .modal-buttons { flex-direction: column; }
  }
</style>
</head>

<body>

<header>
  <div class="logo">📝</div>
  <h1>Share-Notes</h1>
</header>

<div class="tabs">
  <button class="tab active" data-mode="notes">SHARE NOTES</button>
  <button class="tab" data-mode="image">SHARE IMAGE</button>
  <button class="tab" data-mode="code">SHARE CODE</button>
  <button class="tab" data-mode="html">SHARE HTML</button>
</div>

<div class="container">
  <textarea id="editor" class="editor" placeholder="Write your note here..."></textarea>

  <div class="share-area">
    <button class="share-btn" onclick="shareContent()">Share Content</button>
    <div class="status" id="status"></div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="shareModal">
  <div class="modal">
    <button class="close-x" onclick="closeModal()">×</button>
    <h2>Content Shared Successfully!</h2>
    <p>Your content URL:</p>
    <div class="shared-url" id="sharedUrl"></div>

    <div class="modal-buttons">
      <button class="copy-btn" onclick="copyUrl()">COPY URL</button>
      <button class="open-btn" onclick="openUrl()">OPEN</button>
    </div>
  </div>
</div>

<script>
  const editor = document.getElementById('editor');
  const statusEl = document.getElementById('status');
  const modal = document.getElementById('shareModal');
  const sharedUrlEl = document.getElementById('sharedUrl');
  const tabs = document.querySelectorAll('.tab');

  let currentMode = 'notes';
  let currentUrl = '';

  // Tab switching
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentMode = tab.dataset.mode;

      const placeholders = {
        notes: 'Write your note here...',
        image: 'Paste image URL here...',
        code:  'Paste your code here...',
        html:  'Paste your HTML here...'
      };
      editor.placeholder = placeholders[currentMode];
    });
  });

  // Share content
  function shareContent() {
    const content = editor.value.trim();
    if (!content) {
      statusEl.textContent = 'Please write something first.';
      return;
    }

    const data = {
      mode: currentMode,
      content: content
    };

    // Encode ke base64 supaya URL lebih bersih
    const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(data))));

    currentUrl = `${location.origin}${location.pathname}#data=${encoded}`;
    sharedUrlEl.textContent = currentUrl;
    modal.style.display = 'flex';

    statusEl.textContent = 'Content shared successfully!';
  }

  function copyUrl() {
    navigator.clipboard.writeText(currentUrl)
      .then(() => alert('URL copied!'))
      .catch(() => alert('Copy failed.'));
  }

  function openUrl() {
    window.open(currentUrl, '_blank');
  }

  function closeModal() {
    modal.style.display = 'none';
  }

  modal.addEventListener('click', e => {
    if (e.target === modal) closeModal();
  });

  // Load shared content saat halaman dibuka
  window.addEventListener('load', () => {
    if (location.hash.startsWith('#data=')) {
      try {
        const encoded = location.hash.replace('#data=', '');
        const json = decodeURIComponent(escape(atob(encoded)));
        const data = JSON.parse(json);

        editor.value = data.content || '';

        // Aktifkan tab sesuai mode
        tabs.forEach(t => {
          t.classList.toggle('active', t.dataset.mode === data.mode);
        });
        currentMode = data.mode || 'notes';

        statusEl.textContent = 'Shared content loaded.';
      } catch (e) {
        statusEl.textContent = 'Invalid share link.';
      }
    }
  });
</script>

</body>
</html>
